<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1320" viewBox="0 0 1500 1320">
<rect width="100%" height="100%" fill="white"/>
<text x="52" y="72" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#172D47" text-anchor="start">图5  板端入口、初始化与批量任务流程</text>
<text x="54" y="112" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#607185" text-anchor="start">单图与批量入口共用HybridRunner；DPU任务只初始化一次</text>
<path d="M52 134H1448" stroke="#D9E1EB" stroke-width="2"/>
<rect x="65" y="175" width="650" height="120" rx="14" fill="#E9F3FF" stroke="#3178B9" stroke-width="2"/>
<text x="390.0" y="214" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">单图main()</text>
<text x="390.0" y="250.5" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">图片或NPY → 库路径检查 → 加载输入</text>
<rect x="785" y="175" width="650" height="120" rx="14" fill="#E9F3FF" stroke="#3178B9" stroke-width="2"/>
<text x="1110.0" y="214" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">批量main() → run_batch(args)</text>
<text x="1110.0" y="250.5" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">扫描图片 / 标签校验 / 新输出目录</text>
<rect x="280" y="365" width="940" height="160" rx="14" fill="#F0EAFE" stroke="#7C57C2" stroke-width="2"/>
<text x="750.0" y="404" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">HybridRunner.__init__()</text>
<text x="750.0" y="446.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">配置与SO哈希 → inspect_libraries() → 相邻形状校验</text>
<text x="750.0" y="475.0" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">加载PS模型 → dpuOpen → DpuStage初始化与尺度校验</text>
<polyline points="390,295 390,330 750,330 750,365" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,365.0 744.5,354.4 755.5,354.4" fill="#75889E"/>
<polyline points="1110,295 1110,330 750,330" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,330.0 760.6,324.5 760.6,335.5" fill="#75889E"/>
<rect x="280" y="585" width="940" height="105" rx="14" fill="#E9F3FF" stroke="#3178B9" stroke-width="2"/>
<text x="750.0" y="624" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">load_image() → preprocess_rgb()</text>
<text x="750.0" y="660" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">解码 / BGR→RGB / 固定尺寸检查 / mean-std标准化</text>
<polyline points="750.0,525 750.0,585" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,585.0 744.5,574.4 755.5,574.4" fill="#75889E"/>
<rect x="280" y="750" width="940" height="105" rx="14" fill="#E9F3FF" stroke="#3178B9" stroke-width="2"/>
<text x="750.0" y="789" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">批量：首张有效图预热；随后逐张调用predict()</text>
<text x="750.0" y="825" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">模型与任务复用；预热耗时单独记录</text>
<polyline points="750.0,690 750.0,750" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,750.0 744.5,739.4 755.5,739.4" fill="#75889E"/>
<rect x="280" y="915" width="940" height="110" rx="14" fill="#E8F5EE" stroke="#34815C" stroke-width="2"/>
<text x="750.0" y="954" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">记录并汇总结果</text>
<text x="750.0" y="990" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">predictions.csv；summary.json；精度 / 混淆矩阵 / 各段耗时</text>
<polyline points="750.0,855 750.0,915" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,915.0 744.5,904.4 755.5,904.4" fill="#75889E"/>
<polyline points="1220,970 1360,970 1360,637 1220,637" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1220.0,637.0 1230.6,631.5 1230.6,642.5" fill="#75889E"/>
<text x="1350" y="803" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#607185" text-anchor="middle">下一张</text>
<rect x="280" y="1090" width="940" height="110" rx="14" fill="#F2F5F9" stroke="#77879D" stroke-width="2"/>
<text x="750.0" y="1129" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#19364F" text-anchor="middle">finally：保存诊断并close()</text>
<text x="750.0" y="1165" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#3D5369" text-anchor="middle">save_input_report() → 反向释放task/kernel → dpuClose</text>
<polyline points="750.0,1025 750.0,1090" fill="none" stroke="#75889E" stroke-width="3" stroke-linejoin="round"/>
<polygon points="750.0,1090.0 744.5,1079.4 755.5,1079.4" fill="#75889E"/>
<text x="54" y="1295" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#607185" text-anchor="start">单图入口执行一次predict后输出JSON；循环、预热与批量统计属于run_batch。</text>
</svg>